<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="SCAMMED – die fiktive Comedy-Callcenter-Simulation auf Roblox. CALL. CONVINCE. CLIMB.">
  <title>SCAMMED — CALL. CONVINCE. CLIMB.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #070707;
      --panel: #101010;
      --panel-2: #151515;
      --text: #f4f4f4;
      --muted: #9a9a9a;
      --red: #ff3030;
      --red-dark: #a40000;
      --line: rgba(255,255,255,.09);
      --max: 1180px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
    html { scroll-behavior: smooth; }

    body {
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 80% 0%, rgba(255,48,48,.10), transparent 30%),
        radial-gradient(circle at 0% 40%, rgba(255,48,48,.05), transparent 25%),
        var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    a, button { color: inherit; text-decoration: none; cursor: none; }
    img, svg { display: block; max-width: 100%; }

    /* CUSTOM CURSOR */
    .cursor-dot {
      width: 8px; height: 8px; background: var(--red);
      border-radius: 50%; position: fixed; pointer-events: none;
      z-index: 9999; transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }
    .cursor-outline {
      width: 30px; height: 30px; border: 1px solid rgba(255, 48, 48, 0.5);
      border-radius: 50%; position: fixed; pointer-events: none;
      z-index: 9998; transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s;
    }
    .cursor-hover .cursor-dot { width: 0; height: 0; }
    .cursor-hover .cursor-outline {
      width: 50px; height: 50px;
      background: rgba(255, 48, 48, 0.1);
      border-color: var(--red);
    }

    .container {
      width: min(100% - 32px, var(--max));
      margin-inline: auto;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(7,7,7,.72); border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .nav-inner { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { font-size: 20px; font-weight: 900; letter-spacing: .08em; transition: 0.3s; }
    .logo:hover { text-shadow: 0 0 15px rgba(255,48,48,0.5); }
    .logo span { color: var(--red); }
    .nav-links { display: flex; gap: 24px; align-items: center; color: #c8c8c8; font-size: 14px; font-weight: 600; }
    .nav-links a { transition: 0.3s; position: relative; }
    .nav-links a::after {
      content: ''; position: absolute; width: 0; height: 2px;
      bottom: -4px; left: 0; background-color: var(--red); transition: 0.3s;
    }
    .nav-links a:hover { color: white; }
    .nav-links a:hover::after { width: 100%; }

    .nav-btn {
      background: var(--red); color: white; padding: 11px 16px;
      border-radius: 9px; font-weight: 800; font-size: 13px;
      box-shadow: 0 0 25px rgba(255,48,48,.18); transition: .2s;
    }
    .nav-btn:hover { transform: translateY(-2px); }

    /* HERO */
    .hero { min-height: 100svh; display: grid; align-items: center; padding: 110px 0 70px; position: relative; }
    .hero-card {
      position: relative; overflow: hidden; border: 1px solid var(--line);
      border-radius: 22px; min-height: 650px; display: flex; align-items: flex-end;
      background: #111; box-shadow: 0 25px 90px rgba(0,0,0,.55);
    }
    .hero-card::before {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.15) 100%),
        linear-gradient(0deg, rgba(0,0,0,.85), transparent 65%),
        url("cover.jpg") center/cover no-repeat;
      transform: scale(1.01); transition: transform 5s ease;
    }
    .hero-card:hover::before { transform: scale(1.03); }

    .hero-content { position: relative; z-index: 2; max-width: 650px; padding: 56px; }

    .top-badges { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid rgba(255,48,48,.35); background: rgba(255,48,48,.08);
      color: #ff6a6a; padding: 8px 11px; border-radius: 999px;
      font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    }
    .eyebrow::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 12px var(--red);
    }

    /* LIVE COUNTER BADGE */
    .live-counter {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px); padding: 7px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 700; color: #fff;
    }
    .live-dot {
      width: 8px; height: 8px; background-color: #00ff66; border-radius: 50%;
      box-shadow: 0 0 10px #00ff66; animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    h1 { font-size: clamp(54px, 9vw, 110px); line-height: .82; letter-spacing: -.065em; font-weight: 900; text-transform: uppercase; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    h1 span { color: var(--red); }
    .hero-sub { margin-top: 22px; color: #d1d1d1; max-width: 560px; font-size: clamp(15px, 2vw, 19px); line-height: 1.65; }

    .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .btn {
      display: inline-flex; justify-content: center; align-items: center; gap: 10px;
      min-height: 48px; padding: 0 24px; border-radius: 10px;
      font-weight: 800; font-size: 14px; transition: all .3s ease; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }

    .btn-red { background: var(--red); box-shadow: 0 0 20px rgba(255,48,48,.3); border: 1px solid transparent; color: white; }
    .btn-red:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 35px rgba(255,48,48,.5); background: #ff4040; border: 1px solid #ff7070; }

    .btn-blurple { background: #5865F2; box-shadow: 0 0 20px rgba(88, 101, 242, 0.3); color: white; border: 1px solid transparent; }
    .btn-blurple:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 35px rgba(88, 101, 242, 0.5); background: #6974f5; }

    .btn-tiktok { background: #000000; border: 1px solid rgba(255, 255, 255, 0.2); color: white; box-shadow: 0 0 20px rgba(254, 44, 85, 0.2); }
    .btn-tiktok:hover { transform: translateY(-3px) scale(1.02); border-color: #fe2c55; box-shadow: 0 10px 25px rgba(254, 44, 85, 0.4); }

    .btn-dark { border: 1px solid var(--line); background: rgba(255,255,255,.06); backdrop-filter: blur(10px); color: white; }
    .btn-dark:hover { background: rgba(255,255,255,.1); transform: translateY(-3px); }

    /* TICKER TAPE */
    .ticker-wrap { width: 100%; overflow: hidden; background: var(--red); padding: 10px 0; border-top: 1px solid #ff6a6a; border-bottom: 1px solid #ff6a6a; transform: rotate(-1deg) scale(1.02); margin-top: -30px; position: relative; z-index: 10; }
    .ticker { display: flex; white-space: nowrap; animation: ticker 20s linear infinite; font-weight: 900; font-size: 14px; letter-spacing: 0.1em; color: white; text-transform: uppercase; }
    .ticker span { margin: 0 2vw; }
    @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

    /* GENERAL */
    section { padding: 100px 0; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 38px; }
    .section-kicker { color: var(--red); font-size: 11px; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 10px; }
    h2 { font-size: clamp(34px, 6vw, 62px); line-height: .95; letter-spacing: -.045em; }
    .section-desc { color: var(--muted); max-width: 450px; line-height: 1.65; font-size: 14px; }

    /* UPDATE COMING SOON SECTION */
    .update-card {
      background: linear-gradient(135deg, rgba(255, 48, 48, 0.12) 0%, rgba(16, 16, 16, 0.95) 100%);
      border: 1px solid rgba(255, 48, 48, 0.4);
      border-radius: 22px;
      padding: 50px 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(255, 48, 48, 0.15);
      transition: 0.3s;
    }
    .update-card:hover { border-color: rgba(255, 48, 48, 0.7); box-shadow: 0 0 60px rgba(255, 48, 48, 0.25); }
    .update-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--red);
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(255, 48, 48, 0.5);
    }
    .update-card h2 { font-size: clamp(32px, 5vw, 54px); margin-bottom: 12px; }
    .update-card h2 span { color: var(--red); }
    .update-sub { color: var(--muted); font-size: 16px; max-width: 600px; margin-bottom: 35px; line-height: 1.6; }
    
    .update-features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .update-feat {
      display: flex;
      gap: 15px;
      align-items: flex-start;
      background: rgba(255, 255, 255, 0.03);
      padding: 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: 0.3s;
    }
    .update-feat:hover { background: rgba(255, 48, 48, 0.06); border-color: rgba(255, 48, 48, 0.2); }
    .update-icon { font-size: 28px; line-height: 1; }
    .update-feat strong { display: block; font-size: 16px; margin-bottom: 4px; color: #fff; }
    .update-feat p { color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* RULE */
    .rule {
      border: 1px solid rgba(255,48,48,.28); background: linear-gradient(135deg, rgba(255,48,48,.10), rgba(255,255,255,.025));
      border-radius: 18px; padding: 50px; text-align: center; position: relative; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,48,48,0.05);
    }
    .rule::before { content: "01"; position: absolute; right: -10px; top: -30px; font-size: 180px; font-weight: 900; color: rgba(255,255,255,.03); pointer-events: none; }
    .rule small { color: #ff6666; font-weight: 900; letter-spacing: .16em; font-size: 11px; }
    .rule p { margin: 15px auto 0; max-width: 650px; color: var(--muted); line-height: 1.7; }

    /* CARDS */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: linear-gradient(145deg, #121212, #080808); border: 1px solid var(--line);
      border-radius: 16px; padding: 30px; transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative; overflow: hidden;
    }
    .card::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
      transform: skewX(-20deg); transition: 0.5s;
    }
    .card:hover { transform: translateY(-8px); border-color: rgba(255,48,48,.5); box-shadow: 0 15px 30px rgba(255,48,48,.1); }
    .card:hover::after { left: 150%; }

    .number {
      width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center;
      background: rgba(255,48,48,.15); color: var(--red); font-weight: 900; font-size: 14px; margin-bottom: 30px;
      box-shadow: 0 0 15px rgba(255,48,48,0.2);
    }
    .card h3
